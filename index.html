<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#070a12">
<title>Погода · Крым</title>
<style>
@property --c1{syntax:'<color>';inherits:true;initial-value:#3b5bdb}
@property --c2{syntax:'<color>';inherits:true;initial-value:#7c3aed}
:root{
  --bg:#070a12;--fg:#eef2fb;--mute:rgba(238,242,251,.58);--line:rgba(255,255,255,.09);
  --card:rgba(255,255,255,.055);--r:26px;--ease:cubic-bezier(.2,.8,.2,1);
  --c1:#3b5bdb;--c2:#7c3aed;--gx:50vw;--gy:40vh;
  transition:--c1 1.2s ease,--c2 1.2s ease;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100dvh;color:var(--fg);background:var(--bg);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
svg{display:block}

/* ---------- фон ---------- */
.ambient{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.38;will-change:transform}
.b1{width:60vmax;height:60vmax;left:-15vmax;top:-20vmax;background:var(--c1);animation:float1 26s ease-in-out infinite alternate}
.b2{width:55vmax;height:55vmax;right:-18vmax;top:10vh;background:var(--c2);animation:float2 31s ease-in-out infinite alternate}
.b3{width:45vmax;height:45vmax;left:20vw;bottom:-25vmax;background:color-mix(in srgb,var(--c1),var(--c2));animation:float3 36s ease-in-out infinite alternate}
@keyframes float1{to{transform:translate(12vw,10vh) scale(1.15)}}
@keyframes float2{to{transform:translate(-14vw,12vh) scale(.9)}}
@keyframes float3{to{transform:translate(10vw,-12vh) scale(1.2)}}
.dots{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.55) 1px,transparent 1.3px);background-size:30px 30px;
  -webkit-mask-image:radial-gradient(240px circle at var(--gx) var(--gy),#000,transparent 70%);
  mask-image:radial-gradient(240px circle at var(--gx) var(--gy),#000,transparent 70%);opacity:.55}
.glow{position:fixed;left:0;top:0;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;z-index:1;pointer-events:none;
  background:radial-gradient(circle,rgba(130,170,255,.20),rgba(160,120,255,.07) 45%,transparent 68%);
  opacity:0;transition:opacity .5s;mix-blend-mode:screen;will-change:transform}
.glow.on{opacity:1}
.ring{position:fixed;left:0;top:0;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;z-index:90;pointer-events:none;
  border:1px solid rgba(255,255,255,.45);opacity:0;transition:opacity .3s,width .35s var(--ease),height .35s var(--ease),margin .35s var(--ease),background .3s;will-change:transform}
.ring.on{opacity:1}
.ring.big{width:64px;height:64px;margin:-32px 0 0 -32px;background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.7)}
@media (pointer:coarse){.ring{display:none}}

/* ---------- каркас ---------- */
.wrap{position:relative;z-index:2;max-width:1120px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 28px) 20px calc(env(safe-area-inset-bottom) + 48px)}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:26px;animation:up .8s var(--ease) both}
.hello{font-size:14px;color:var(--mute);letter-spacing:.02em;margin-bottom:6px}
h1{margin:0;font-size:clamp(34px,6vw,52px);font-weight:300;letter-spacing:-.03em;line-height:1}
h1 b{font-weight:600}
.hr{display:flex;align-items:center;gap:12px}
.upd{font-size:12px;color:var(--mute);text-align:right;line-height:1.35}
.btn{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;background:var(--card);
  border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:transform .25s var(--ease),background .25s}
.btn:hover{background:rgba(255,255,255,.11);transform:translateY(-2px)}
.btn:active{transform:scale(.92)}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes up{from{opacity:0;transform:translateY(18px)}}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;perspective:1000px}
@media(max-width:560px){.grid{grid-template-columns:1fr;gap:12px}.wrap{padding-left:14px;padding-right:14px}}

/* ---------- карточка ---------- */
.card{position:relative;overflow:hidden;border-radius:var(--r);padding:20px 20px 18px;min-height:210px;cursor:pointer;
  background:linear-gradient(160deg,rgba(255,255,255,.085),rgba(255,255,255,.035));
  border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  display:flex;flex-direction:column;user-select:none;outline:none;
  --mx:50%;--my:0%;--rx:0deg;--ry:0deg;--ty:0px;
  transform:rotateX(var(--rx)) rotateY(var(--ry)) translateY(var(--ty));
  transition:transform .35s var(--ease),box-shadow .35s,opacity .3s;will-change:transform}
.card.in{animation:cardIn .7s var(--ease) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes cardIn{from{opacity:0;transform:translateY(26px) scale(.96)}}
.card::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(320px circle at var(--mx) var(--my),rgba(255,255,255,.13),transparent 45%)}
.card::after{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(220px circle at var(--mx) var(--my),rgba(150,185,255,.9),transparent 60%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.card:hover,.card.pressed,.card:focus-visible{--ty:-4px;box-shadow:0 18px 50px -18px rgba(0,0,0,.7)}
.card:hover::before,.card:hover::after,.card.pressed::before,.card.pressed::after,.card:focus-visible::after{opacity:1}
.card.out{opacity:0;transform:scale(.9)}
.c-top{display:flex;justify-content:space-between;align-items:flex-start}
.c-name{font-size:19px;font-weight:600;letter-spacing:-.01em}
.c-sub{font-size:12.5px;color:var(--mute);margin-top:2px}
.rm{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;margin:-4px -6px 0 0;color:var(--mute);
  opacity:.0;transition:opacity .25s,background .25s,color .25s,transform .25s var(--ease);position:relative;z-index:3}
.rm svg{width:15px;height:15px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round}
.card:hover .rm,.card:focus-within .rm{opacity:1}
.rm:hover{background:rgba(255,90,90,.2);color:#ff8a8a;transform:rotate(90deg)}
@media(hover:none){.rm{opacity:.55}}
.c-mid{display:flex;align-items:center;justify-content:space-between;margin:8px 0 2px;flex:1}
.c-temp{font-size:64px;font-weight:200;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.c-icon{width:84px;height:84px;filter:drop-shadow(0 8px 20px rgba(0,0,0,.3))}
.c-desc{font-size:15px;color:var(--fg);opacity:.9}
.c-meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:13px;color:var(--mute)}
.c-meta span{display:inline-flex;align-items:center;gap:5px}
.c-meta svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ripple{position:absolute;border-radius:50%;pointer-events:none;background:rgba(255,255,255,.22);transform:scale(0);animation:rip .7s ease-out forwards;z-index:2}
@keyframes rip{to{transform:scale(1);opacity:0}}
.sk .c-temp,.sk .c-desc,.sk .c-icon,.sk .c-meta{position:relative;color:transparent;border-radius:12px;overflow:hidden;background:rgba(255,255,255,.07)}
.sk .c-temp{width:120px;height:56px}.sk .c-desc{width:140px;height:18px;margin-top:6px}.sk .c-meta{height:16px;width:200px}
.sk .c-icon{border-radius:50%}
.sk .c-temp::after,.sk .c-desc::after,.sk .c-icon::after,.sk .c-meta::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent);animation:shim 1.4s infinite}
.sk .c-meta *{display:none}
@keyframes shim{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.err .c-desc{color:#ffb4b4}

.add{border-style:dashed;align-items:center;justify-content:center;gap:12px;color:var(--mute);background:transparent;min-height:210px}
.add .plus{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--card);transition:transform .4s var(--ease),background .3s}
.add .plus svg{width:24px;height:24px;stroke:var(--fg);stroke-width:2;fill:none;stroke-linecap:round}
.add:hover .plus{transform:rotate(90deg) scale(1.08);background:rgba(255,255,255,.12)}
.add span{font-size:14px}

/* ---------- иконки погоды ---------- */
.wi{width:100%;height:100%;overflow:visible}
.wi .spin{animation:spin 22s linear infinite}
.wi .drift{animation:drift 7s ease-in-out infinite alternate}
.wi .drift2{animation:drift 9s ease-in-out infinite alternate-reverse}
.wi .drop{animation:drop 1.1s linear infinite}
.wi .flake{animation:flake 2.6s linear infinite}
.wi .flash{animation:flash 2.8s infinite}
.wi .twk{animation:twk 3s ease-in-out infinite}
.wi .fog{animation:fogm 5s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(4px)}}
@keyframes drop{0%{transform:translateY(-3px);opacity:0}20%{opacity:1}100%{transform:translateY(9px);opacity:0}}
@keyframes flake{0%{transform:translate(0,-3px);opacity:0}20%{opacity:1}100%{transform:translate(3px,10px);opacity:0}}
@keyframes flash{0%,55%,100%{opacity:1}60%{opacity:.25}65%{opacity:1}72%{opacity:.3}78%{opacity:1}}
@keyframes twk{50%{opacity:.25}}
@keyframes fogm{to{transform:translateX(6px)}}

/* ---------- подложка и панель деталей ---------- */
.backdrop{position:fixed;inset:0;z-index:50;background:rgba(3,5,12,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  opacity:0;pointer-events:none;transition:opacity .45s}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset:0;margin:auto;z-index:60;width:min(880px,calc(100vw - 32px));height:min(calc(100dvh - 32px),940px);
  border-radius:32px;overflow:hidden;display:none;background:
  radial-gradient(900px 500px at 85% -10%,color-mix(in srgb,var(--c1) 38%,transparent),transparent 70%),
  radial-gradient(700px 500px at -10% 110%,color-mix(in srgb,var(--c2) 30%,transparent),transparent 70%),#0b0f1c;
  border:1px solid rgba(255,255,255,.12);box-shadow:0 40px 120px -20px rgba(0,0,0,.8);will-change:transform,left,top,width,height}
.sheet.show{display:block}
@media(max-width:640px){.sheet{width:100vw;height:100dvh;border-radius:0;border:0}}
.sheet-scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sheet-inner{padding:calc(env(safe-area-inset-top) + 26px) 26px calc(env(safe-area-inset-bottom) + 40px);position:relative}
@media(max-width:640px){.sheet-inner{padding-left:18px;padding-right:18px}}
.grab{display:none;width:42px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);margin:-14px auto 14px}
@media(max-width:640px){.grab{display:block}}
.close{position:absolute;right:18px;top:calc(env(safe-area-inset-top) + 18px);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.08);border:1px solid var(--line);z-index:5;transition:transform .3s var(--ease),background .3s}
.close:hover{background:rgba(255,255,255,.16);transform:rotate(90deg)}
.close svg{width:18px;height:18px;stroke:#fff;stroke-width:2.2;fill:none;stroke-linecap:round}
.hero{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-right:44px}
.hero .sub{color:var(--mute);font-size:14px}
.hero h2{margin:2px 0 8px;font-size:clamp(28px,5vw,40px);font-weight:600;letter-spacing:-.02em}
.hero .big{font-size:clamp(82px,18vw,128px);font-weight:200;letter-spacing:-.06em;line-height:.95;font-variant-numeric:tabular-nums}
.hero .desc{font-size:17px;margin-top:8px}
.hero .hl{color:var(--mute);margin-top:4px;font-size:15px}
.hero-icon{width:clamp(110px,26vw,190px);height:clamp(110px,26vw,190px);flex:none;filter:drop-shadow(0 14px 34px rgba(0,0,0,.4))}
.blk{margin-top:26px}
.blk h3{margin:0 0 12px;font-size:12.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px}
.hours{display:flex;gap:6px;overflow-x:auto;padding:14px 10px;scrollbar-width:none;scroll-snap-type:x proximity}
.hours::-webkit-scrollbar{display:none}
.h{flex:none;width:62px;text-align:center;padding:8px 0;border-radius:16px;scroll-snap-align:start}
.h:first-child{background:rgba(255,255,255,.09)}
.h .t{font-size:12.5px;color:var(--mute)}
.h .i{width:34px;height:34px;margin:8px auto 6px}
.h .v{font-size:16px;font-weight:500}
.h .p{font-size:11.5px;color:#7fc4ff;height:14px;margin-top:3px}
.days{padding:6px 16px}
.d{display:grid;grid-template-columns:78px 36px 40px 34px 1fr 34px;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.d:last-child{border:0}
.d .n{font-size:15px;font-weight:500}.d .n small{display:block;color:var(--mute);font-size:11.5px;font-weight:400}
.d .i{width:34px;height:34px}
.d .pp{font-size:12px;color:#7fc4ff;text-align:center}
.d .mn{text-align:right;color:var(--mute);font-variant-numeric:tabular-nums}
.d .mx{font-variant-numeric:tabular-nums}
.d .wd{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:3px;justify-content:center}
.d .wd svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.1);position:relative}
.bar i{position:absolute;top:0;bottom:0;border-radius:3px;transform-origin:left;transform:scaleX(0);transition:transform .9s var(--ease) .35s}
.sheet.open .bar i{transform:scaleX(1)}
@media(max-width:520px){.d{grid-template-columns:62px 32px 1fr 30px 30px;gap:6px}.d .pp,.d .wd{display:none}}
.wind{display:flex;align-items:center;gap:22px;padding:20px;flex-wrap:wrap}
.compass{width:150px;height:150px;flex:none}
.compass .arrow{transform-origin:75px 75px;transition:transform 1.4s var(--ease) .4s}
.wtxt .sp{font-size:44px;font-weight:300;letter-spacing:-.03em}.wtxt .sp small{font-size:16px;color:var(--mute);margin-left:4px}
.wtxt .dn{font-size:16px;margin-top:2px}.wtxt .ex{color:var(--mute);font-size:14px;margin-top:6px;line-height:1.5}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.tile{padding:16px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.tile .k{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px}
.tile .k svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile .v{font-size:26px;font-weight:400;margin-top:8px;letter-spacing:-.02em}
.tile .v small{font-size:13px;color:var(--mute);margin-left:3px}
.tile .s{font-size:12.5px;color:var(--mute);margin-top:4px}
.tile .meter{height:5px;border-radius:3px;background:rgba(255,255,255,.1);margin-top:10px;overflow:hidden}
.tile .meter i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#5ab0ff,#a78bfa);width:0;transition:width 1s var(--ease) .5s}
.foot{margin-top:26px;text-align:center;color:var(--mute);font-size:12px;opacity:.7}
.rv{opacity:0;transform:translateY(16px)}
.sheet.open .rv{animation:rvIn .7s var(--ease) both;animation-delay:calc(.25s + var(--i,0)*70ms)}
@keyframes rvIn{to{opacity:1;transform:none}}

/* ---------- поиск города ---------- */
.modal{position:fixed;z-index:70;left:50%;top:12vh;width:min(520px,calc(100vw - 28px));transform:translate(-50%,24px) scale(.97);opacity:0;pointer-events:none;
  background:#0d1222;border:1px solid rgba(255,255,255,.12);border-radius:28px;padding:22px;box-shadow:0 40px 100px -20px rgba(0,0,0,.8);
  transition:opacity .35s,transform .45s var(--ease)}
.modal.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.modal h4{margin:0 0 14px;font-size:20px;font-weight:600}
.search{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:16px;padding:0 14px;transition:border-color .25s,box-shadow .25s}
.search:focus-within{border-color:rgba(130,170,255,.7);box-shadow:0 0 0 4px rgba(130,170,255,.15)}
.search svg{width:18px;height:18px;stroke:var(--mute);fill:none;stroke-width:2;stroke-linecap:round;flex:none}
.search input{flex:1;height:50px;background:none;border:0;outline:0;color:var(--fg);font:inherit;font-size:16px;min-width:0}
.results{margin-top:10px;max-height:34vh;overflow:auto;display:flex;flex-direction:column;gap:4px}
.res{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;padding:11px 12px;border-radius:14px;transition:background .2s}
.res:hover{background:rgba(255,255,255,.08)}
.res b{font-weight:500;display:block}.res small{color:var(--mute);font-size:12.5px}
.res em{font-style:normal;font-size:12px;color:var(--mute)}
.hint{color:var(--mute);font-size:14px;padding:10px 4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:14px;transition:background .2s,transform .2s var(--ease)}
.chip:hover{background:rgba(255,255,255,.14);transform:translateY(-2px)}
.chip:active{transform:scale(.95)}
.chip.dis{opacity:.4;pointer-events:none}
.lbl{margin-top:16px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
@media(max-width:640px){.modal{top:auto;bottom:0;left:0;width:100%;border-radius:28px 28px 0 0;transform:translateY(100%);padding-bottom:calc(env(safe-area-inset-bottom) + 22px)}
  .modal.on{transform:none}}

/* ---------- тост ---------- */
.toast{position:fixed;z-index:100;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translate(-50%,30px);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:14px;padding:12px 16px 12px 18px;border-radius:16px;background:rgba(24,30,50,.95);border:1px solid var(--line);
  backdrop-filter:blur(14px);font-size:14px;transition:all .45s var(--ease);max-width:calc(100vw - 28px)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:#8ab4ff;font-weight:600}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="ambient"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div class="dots"></div>
<div class="glow" id="glow"></div>
<div class="ring" id="ring"></div>

<div class="wrap">
  <header>
    <div>
      <div class="hello" id="hello"></div>
      <h1>Пог<b>ода</b></h1>
    </div>
    <div class="hr">
      <div class="upd" id="upd"></div>
      <button class="btn" id="refresh" aria-label="Обновить"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg></button>
    </div>
  </header>
  <main class="grid" id="grid"></main>
</div>

<div class="backdrop" id="backdrop"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="sheet-scroll" id="sscroll"></div></section>

<div class="modal" id="modal" role="dialog" aria-label="Добавить город">
  <h4>Добавить город</h4>
  <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Название города…" autocomplete="off" enterkeyhint="search"></label>
  <div class="results" id="results"></div>
  <div class="lbl">Быстрый выбор</div>
  <div class="chips" id="chips"></div>
</div>
<div class="toast" id="toast"><span id="tmsg"></span><button id="tact" hidden></button></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const vib=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};

/* ---------- данные ---------- */
const DEFAULTS=[
  {id:'armyansk',name:'Армянск',sub:'Крым',lat:46.1117,lon:33.6914},
  {id:'simferopol',name:'Симферополь',sub:'Крым',lat:44.9521,lon:34.1024},
  {id:'yalta',name:'Ялта',sub:'Крым',lat:44.4952,lon:34.1663},
  {id:'sevastopol',name:'Севастополь',sub:'Крым',lat:44.6054,lon:33.5220}
];
const QUICK=[
  {name:'Евпатория',sub:'Крым',lat:45.1904,lon:33.3670},{name:'Феодосия',sub:'Крым',lat:45.0319,lon:35.3824},
  {name:'Керчь',sub:'Крым',lat:45.3562,lon:36.4674},{name:'Алушта',sub:'Крым',lat:44.6763,lon:34.4100},
  {name:'Джанкой',sub:'Крым',lat:45.7086,lon:34.3935},{name:'Бахчисарай',sub:'Крым',lat:44.7527,lon:33.8644},
  {name:'Москва',sub:'Россия',lat:55.7558,lon:37.6173},{name:'Краснодар',sub:'Россия',lat:45.0355,lon:38.9753},
  {name:'Санкт-Петербург',sub:'Россия',lat:59.9343,lon:30.3351}
];
const MAX_CITIES=12;
const store={
  get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let cities=store.get('wx_cities_v1',DEFAULTS);
if(!Array.isArray(cities)||!cities.length)cities=DEFAULTS.slice();
let cache=store.get('wx_cache_v1',{});
const data={};                         // id -> parsed
const state={};                        // id -> 'loading' | 'ok' | 'err'
cities.forEach(c=>{if(cache[c.id]){data[c.id]=cache[c.id];state[c.id]='ok'}else state[c.id]='loading'});
const cid=(lat,lon)=>lat.toFixed(3)+'_'+lon.toFixed(3);

/* ---------- погодные коды ---------- */
function info(code,day){
  const m={0:['Ясно','clear'],1:['Малооблачно','partly'],2:['Переменная облачность','partly'],3:['Пасмурно','cloud'],
    45:['Туман','fog'],48:['Изморозь','fog'],51:['Лёгкая морось','drizzle'],53:['Морось','drizzle'],55:['Сильная морось','drizzle'],
    56:['Ледяная морось','drizzle'],57:['Ледяная морось','drizzle'],61:['Небольшой дождь','rain'],63:['Дождь','rain'],65:['Сильный дождь','rain'],
    66:['Ледяной дождь','rain'],67:['Ледяной дождь','rain'],71:['Небольшой снег','snow'],73:['Снег','snow'],75:['Сильный снегопад','snow'],
    77:['Снежная крупа','snow'],80:['Ливень','rain'],81:['Сильный ливень','rain'],82:['Очень сильный ливень','rain'],
    85:['Снегопад','snow'],86:['Сильный снегопад','snow'],95:['Гроза','storm'],96:['Гроза с градом','storm'],99:['Гроза с градом','storm']};
  const r=m[code]||['—','cloud'];
  let t=r[0];if(code===0&&!day)t='Ясно';
  return{text:t,kind:r[1],day:!!day};
}

/* ---------- анимированные иконки (inline SVG) ---------- */
const COL={sun:'#ffc94d',moon:'#dfe6ff',cl:'#eef3fb',cm:'#c3cfdf',cd:'#93a3bb',rain:'#6cb6ff',snow:'#ffffff',bolt:'#ffd84d'};
const CL=(x,y,s,f,cls='')=>`<path class="${cls}" transform="translate(${x} ${y}) scale(${s})" fill="${f}" d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>`;
function sunSvg(cx,cy,r,len){
  let l='';for(let i=0;i<8;i++){const a=i*Math.PI/4,r1=r+4,r2=r+4+len;
    l+=`<line x1="${(cx+Math.cos(a)*r1).toFixed(1)}" y1="${(cy+Math.sin(a)*r1).toFixed(1)}" x2="${(cx+Math.cos(a)*r2).toFixed(1)}" y2="${(cy+Math.sin(a)*r2).toFixed(1)}"/>`}
  return`<g class="spin" style="transform-origin:${cx}px ${cy}px" stroke="${COL.sun}" stroke-width="3" stroke-linecap="round">${l}</g><circle cx="${cx}" cy="${cy}" r="${r}" fill="${COL.sun}"/>`;
}
const MOON=(x,y,s)=>`<path transform="translate(${x} ${y}) scale(${s})" fill="${COL.moon}" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>`;
function icon(kind,day){
  let b='';
  switch(kind){
    case'clear':b=day?sunSvg(32,32,12,6):MOON(7,7,2.2)+`<circle class="twk" cx="52" cy="12" r="1.8" fill="#fff"/><circle class="twk" style="animation-delay:1.2s" cx="14" cy="16" r="1.4" fill="#fff"/>`;break;
    case'partly':b=(day?sunSvg(24,23,8,5):MOON(6,2,1.7))+CL(8,12,2.15,COL.cl,'drift');break;
    case'cloud':b=CL(14,4,1.9,COL.cd,'drift2')+CL(4,12,2.25,COL.cl,'drift');break;
    case'fog':b=CL(6,0,2.2,COL.cm,'drift')+`<g stroke="${COL.cl}" stroke-width="3.2" stroke-linecap="round"><line class="fog" x1="14" y1="50" x2="44" y2="50"/><line class="fog" style="animation-delay:-2s" x1="22" y1="57" x2="52" y2="57"/></g>`;break;
    case'drizzle':case'rain':{
      const n=kind==='rain'?3:2,xs=n===3?[22,32,42]:[26,38];
      b=CL(6,0,2.2,COL.cm,'drift')+xs.map((x,i)=>`<line class="drop" style="animation-delay:${i*.35}s" x1="${x}" y1="46" x2="${x-3}" y2="53" stroke="${COL.rain}" stroke-width="3" stroke-linecap="round"/>`).join('');break}
    case'snow':b=CL(6,0,2.2,COL.cm,'drift')+[22,32,42].map((x,i)=>`<circle class="flake" style="animation-delay:${i*.6}s" cx="${x}" cy="49" r="2.6" fill="${COL.snow}"/>`).join('');break;
    case'storm':b=CL(6,0,2.2,COL.cd,'drift')+`<polygon class="flash" fill="${COL.bolt}" points="35,38 26,52 33,52 29,62 42,46 35,46 39,38"/>`;break;
  }
  return`<svg class="wi" viewBox="0 0 64 64" aria-hidden="true">${b}</svg>`;
}
const MOOD={clear:['#2563eb','#f59e0b'],clearN:['#312e81','#1e3a8a'],partly:['#3b82f6','#64748b'],cloud:['#475569','#334155'],
  fog:['#64748b','#94a3b8'],drizzle:['#2563eb','#0e7490'],rain:['#1d4ed8','#0e7490'],snow:['#60a5fa','#94a3b8'],storm:['#6d28d9','#1e293b']};
function setMood(id){
  const d=data[id];let m=['#3b5bdb','#7c3aed'];
  if(d){const i=info(d.cur.code,d.cur.day);m=MOOD[i.kind==='clear'&&!i.day?'clearN':i.kind]||m}
  document.documentElement.style.setProperty('--c1',m[0]);document.documentElement.style.setProperty('--c2',m[1]);
}

/* ---------- мелкие иконки ---------- */
const IC={
  wind:'<svg viewBox="0 0 24 24"><path d="M3 8h10a3 3 0 1 0-3-3"/><path d="M3 12h15a3 3 0 1 1-3 3"/><path d="M3 16h6"/></svg>',
  drop:'<svg viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>',
  thermo:'<svg viewBox="0 0 24 24"><path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z"/></svg>',
  gauge:'<svg viewBox="0 0 24 24"><path d="M4 16a8 8 0 1 1 16 0"/><path d="M12 16l4-5"/></svg>',
  eye:'<svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  sun:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  rise:'<svg viewBox="0 0 24 24"><path d="M12 3v7M8.5 6.5L12 3l3.5 3.5"/><path d="M5 17a7 7 0 0 1 14 0M2 21h20"/></svg>',
  set:'<svg viewBox="0 0 24 24"><path d="M12 10V3M8.5 6.5L12 10l3.5-3.5"/><path d="M5 17a7 7 0 0 1 14 0M2 21h20"/></svg>',
  cloud:'<svg viewBox="0 0 24 24"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>',
  rain:'<svg viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>',
  arrow:'<svg viewBox="0 0 24 24"><path d="M12 4v16M6 10l6-6 6 6"/></svg>',
  x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};
const DIR=['С','СВ','В','ЮВ','Ю','ЮЗ','З','СЗ'];
const DIRN=['Северный','Северо-восточный','Восточный','Юго-восточный','Южный','Юго-западный','Западный','Северо-западный'];
const dIdx=d=>Math.round((d%360)/45)%8;
const T=t=>Math.round(t)+'°';
const tcol=t=>`hsl(${Math.round(210-(clamp(t,-10,35)+10)/45*200)} 90% 62%)`;

/* ---------- запрос погоды ---------- */
const API='https://api.open-meteo.com/v1/forecast?current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m,pressure_msl,is_day,precipitation,cloud_cover,visibility'
 +'&hourly=temperature_2m,weather_code,precipitation_probability,is_day'
 +'&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,wind_direction_10m_dominant,sunrise,sunset,uv_index_max'
 +'&timezone=auto&forecast_days=7&wind_speed_unit=ms';
function parse(r){
  const c=r.current,h=r.hourly,d=r.daily;
  let i0=h.time.findIndex(t=>t.slice(0,13)===c.time.slice(0,13));if(i0<0)i0=0;
  const hours=[];for(let i=i0;i<Math.min(i0+24,h.time.length);i++)hours.push({t:h.time[i],temp:h.temperature_2m[i],code:h.weather_code[i],pop:h.precipitation_probability[i],day:h.is_day[i]});
  const days=d.time.map((t,i)=>({date:t,code:d.weather_code[i],max:d.temperature_2m_max[i],min:d.temperature_2m_min[i],pr:d.precipitation_sum[i],
    pop:d.precipitation_probability_max[i],wind:d.wind_speed_10m_max[i],dir:d.wind_direction_10m_dominant[i],sr:d.sunrise[i],ss:d.sunset[i],uv:d.uv_index_max[i]}));
  return{cur:{temp:c.temperature_2m,feels:c.apparent_temperature,hum:c.relative_humidity_2m,code:c.weather_code,day:c.is_day,wind:c.wind_speed_10m,
    dir:c.wind_direction_10m,gust:c.wind_gusts_10m,press:c.pressure_msl,cloud:c.cloud_cover,vis:c.visibility,prec:c.precipitation,time:c.time},hours,days,fetched:Date.now()};
}
async function fetchCity(c){
  const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),15000);
  try{const r=await fetch(`${API}&latitude=${c.lat}&longitude=${c.lon}`,{signal:ctl.signal});
    if(!r.ok)throw new Error(r.status);return parse(await r.json())}finally{clearTimeout(to)}
}
async function load(c){
  try{const p=await fetchCity(c);data[c.id]=p;state[c.id]='ok';cache[c.id]=p;store.set('wx_cache_v1',cache)}
  catch(e){state[c.id]=data[c.id]?'stale':'err'}
  updateCard(c.id);
}
let lastRefresh=0;
async function refreshAll(){
  const b=$('#refresh');b.classList.add('spin');
  await Promise.allSettled(cities.map(load));
  lastRefresh=Date.now();b.classList.remove('spin');
  if(!sheetOpen)setMood(cities[0].id);
  const bad=cities.some(c=>state[c.id]==='err'||state[c.id]==='stale');
  $('#upd').innerHTML=bad?'нет связи —<br>показаны сохранённые данные':'обновлено<br>'+new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});
}

/* ---------- карточки ---------- */
const grid=$('#grid');
function cardHTML(c){
  const d=data[c.id],st=state[c.id];
  let body;
  if(!d){
    body=st==='err'
      ?`<div class="c-mid"><div class="c-temp" style="font-size:40px">—</div></div><div class="c-desc">Не удалось загрузить · нажмите, чтобы повторить</div>`
      :`<div class="c-mid"><div class="c-temp">00°</div><div class="c-icon"></div></div><div class="c-desc">Загрузка</div><div class="c-meta">.</div>`;
  }else{
    const i=info(d.cur.code,d.cur.day),t=d.days[0];
    body=`<div class="c-mid"><div class="c-temp" data-v="${Math.round(d.cur.temp)}">${T(d.cur.temp)}</div><div class="c-icon">${icon(i.kind,i.day)}</div></div>
    <div class="c-desc">${i.text}</div>
    <div class="c-meta"><span>↑ ${T(t.max)} &nbsp;↓ ${T(t.min)}</span><span>${IC.wind}${Math.round(d.cur.wind)} м/с ${DIR[dIdx(d.cur.dir)]}</span><span>${IC.drop}${d.cur.hum}%</span></div>`;
  }
  return`<button class="rm" aria-label="Убрать ${c.name}">${IC.x}</button>
    <div class="c-top"><div><div class="c-name">${c.name}</div><div class="c-sub">${c.sub||''}</div></div></div>${body}`;
}
function makeCard(c,i,anim){
  const el=document.createElement('article');
  el.className='card'+(data[c.id]?'':' sk')+(state[c.id]==='err'?' err':'')+(anim?' in':'');
  el.dataset.id=c.id;el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label',c.name);el.style.setProperty('--i',i);
  el.innerHTML=cardHTML(c);return el;
}
function addTile(){
  const el=document.createElement('article');el.className='card add';el.tabIndex=0;el.setAttribute('role','button');
  el.innerHTML=`<div class="plus"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div><span>Добавить город</span>`;
  return el;
}
function renderGrid(anim){
  grid.innerHTML='';
  cities.forEach((c,i)=>grid.appendChild(makeCard(c,i,anim)));
  if(cities.length<MAX_CITIES)grid.appendChild(addTile());
  countUpAll();
}
function updateCard(id){
  const c=cities.find(x=>x.id===id);if(!c)return;
  const old=grid.querySelector(`.card[data-id="${CSS.escape(id)}"]`);if(!old)return;
  const el=makeCard(c,0,false);el.style.animation='';
  if(old.style.visibility==='hidden')el.style.visibility='hidden';
  const wasOpen=old.classList.contains('lifted');if(wasOpen)el.classList.add('lifted');
  old.replaceWith(el);
  const t=el.querySelector('.c-temp[data-v]');if(t&&!t.dataset.done)countUp(t);
  if(id===cities[0].id&&!sheetOpen)setMood(id);
}
function countUp(el){
  const to=+el.dataset.v;el.dataset.done=1;
  const t0=performance.now(),D=800;
  (function f(n){const p=clamp((n-t0)/D,0,1),e=1-Math.pow(1-p,3);el.textContent=Math.round(to*e)+'°';if(p<1)requestAnimationFrame(f)})(t0);
}
function countUpAll(){grid.querySelectorAll('.c-temp[data-v]').forEach(countUp)}

/* FLIP-анимация соседей при добавлении/удалении */
function flipGrid(mutate){
  const before={};grid.querySelectorAll('.card[data-id]').forEach(e=>before[e.dataset.id]=e.getBoundingClientRect());
  mutate();
  grid.querySelectorAll('.card').forEach(e=>{
    const o=before[e.dataset.id];if(!o)return;const n=e.getBoundingClientRect();
    const dx=o.left-n.left,dy=o.top-n.top;if(!dx&&!dy)return;
    e.animate([{translate:`${dx}px ${dy}px`},{translate:'0 0'}],{duration:550,easing:'cubic-bezier(.2,.8,.2,1)'});
  });
}

/* ---------- удаление / добавление ---------- */
let toastT;
function toast(msg,label,fn){
  const t=$('#toast'),a=$('#tact');$('#tmsg').textContent=msg;
  a.hidden=!label;a.textContent=label||'';a.onclick=()=>{fn&&fn();t.classList.remove('on')};
  t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),label?5500:2800);
}
function save(){store.set('wx_cities_v1',cities)}
function removeCity(id){
  if(cities.length<=1){toast('Нужен хотя бы один город');return}
  const idx=cities.findIndex(c=>c.id===id),removed=cities[idx];
  const el=grid.querySelector(`.card[data-id="${CSS.escape(id)}"]`);vib(12);
  if(el)el.classList.add('out');
  setTimeout(()=>{
    flipGrid(()=>{cities.splice(idx,1);save();renderGrid(false)});
    setMood(cities[0].id);
    toast(`«${removed.name}» убран`,'Отменить',()=>{
      flipGrid(()=>{cities.splice(Math.min(idx,cities.length),0,removed);save();renderGrid(false)});
      if(!data[removed.id])load(removed);
    });
  },260);
}
function addCity(c){
  const id=c.id||cid(c.lat,c.lon);
  if(cities.some(x=>x.id===id||Math.abs(x.lat-c.lat)<.05&&Math.abs(x.lon-c.lon)<.05)){toast('Этот город уже добавлен');return}
  if(cities.length>=MAX_CITIES){toast(`Максимум ${MAX_CITIES} городов`);return}
  const n={id,name:c.name,sub:c.sub,lat:c.lat,lon:c.lon};
  closeModal();vib(10);
  setTimeout(()=>{
    flipGrid(()=>{cities.push(n);state[id]='loading';save();renderGrid(false);
      const el=grid.querySelector(`.card[data-id="${CSS.escape(id)}"]`);if(el){el.classList.add('in');el.style.setProperty('--i',0);el.scrollIntoView({behavior:'smooth',block:'center'})}});
    load(n);toast(`«${n.name}» добавлен`);
  },200);
}

/* ---------- поиск ---------- */
const modal=$('#modal'),qIn=$('#q'),resEl=$('#results');
let sT,sCtl;
function openModal(){
  backdrop.classList.add('on');modal.classList.add('on');
  $('#chips').innerHTML=QUICK.map((q,i)=>{const dis=cities.some(c=>Math.abs(c.lat-q.lat)<.05&&Math.abs(c.lon-q.lon)<.05);
    return`<button class="chip${dis?' dis':''}" data-i="${i}">${q.name}</button>`}).join('');
  resEl.innerHTML='<div class="hint">Введите название — например, «Алушта» или «Сочи»</div>';
  qIn.value='';setTimeout(()=>qIn.focus({preventScroll:true}),350);
}
function closeModal(){modal.classList.remove('on');if(!sheetOpen)backdrop.classList.remove('on');qIn.blur()}
qIn.addEventListener('input',()=>{
  clearTimeout(sT);const v=qIn.value.trim();
  if(v.length<2){resEl.innerHTML='<div class="hint">Введите минимум 2 буквы</div>';return}
  resEl.innerHTML='<div class="hint">Ищу…</div>';
  sT=setTimeout(async()=>{
    try{sCtl&&sCtl.abort();sCtl=new AbortController();
      const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?count=8&language=ru&name='+encodeURIComponent(v),{signal:sCtl.signal});
      const j=await r.json();const list=(j.results||[]);
      if(!list.length){resEl.innerHTML='<div class="hint">Ничего не найдено</div>';return}
      resEl.innerHTML=list.map((x,i)=>{
        const sub=[x.admin1,x.country].filter(Boolean).join(', ');
        const has=cities.some(c=>Math.abs(c.lat-x.latitude)<.05&&Math.abs(c.lon-x.longitude)<.05);
        return`<button class="res" data-i="${i}"><span><b>${x.name}</b><small>${sub}</small></span><em>${has?'добавлен':'+'}</em></button>`}).join('');
      resEl._list=list;
    }catch(e){if(e.name!=='AbortError')resEl.innerHTML='<div class="hint">Нет соединения с поиском</div>'}
  },320);
});
resEl.addEventListener('click',e=>{
  const b=e.target.closest('.res');if(!b)return;const x=resEl._list[+b.dataset.i];
  addCity({name:x.name,sub:[x.admin1,x.country].filter(Boolean).join(', '),lat:x.latitude,lon:x.longitude});
});
$('#chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(b)addCity({...QUICK[+b.dataset.i]})});

/* ---------- детальная панель ---------- */
const sheet=$('#sheet'),sscroll=$('#sscroll'),backdrop=$('#backdrop');
let sheetOpen=false,openId=null,openCard=null,animating=false,pushed=false;
const kf=(r,rad)=>({left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px',right:'auto',bottom:'auto',margin:'0px',borderRadius:rad});
const isMobile=()=>innerWidth<=640;
const tm=s=>s.slice(11,16);
function uvLabel(u){return u<3?'Низкий':u<6?'Умеренный':u<8?'Высокий':u<11?'Очень высокий':'Экстремальный'}
function windLabel(v){return v<1?'Штиль':v<4?'Слабый ветер':v<8?'Умеренный ветер':v<14?'Сильный ветер':'Штормовой ветер'}
function detailHTML(c,d){
  const cu=d.cur,i=info(cu.code,cu.day),td=d.days[0];
  let k=6;const rv=()=>`class="rv" style="--i:${k++}"`;
  const gmin=Math.min(...d.days.map(x=>x.min)),gmax=Math.max(...d.days.map(x=>x.max)),rg=Math.max(1,gmax-gmin);
  const dn=['Сегодня','Завтра'];
  const hours=d.hours.map((h,n)=>{const hi=info(h.code,h.day);
    return`<div class="h"><div class="t">${n?tm(h.t):'Сейчас'}</div><div class="i">${icon(hi.kind,hi.day)}</div><div class="v">${T(h.temp)}</div><div class="p">${h.pop>=20?h.pop+'%':''}</div></div>`}).join('');
  const days=d.days.map((x,n)=>{const di=info(x.code,1);const dt=new Date(x.date+'T12:00');
    const nm=dn[n]||dt.toLocaleDateString('ru',{weekday:'short'}).replace(/^./,m=>m.toUpperCase());
    const l=(x.min-gmin)/rg*100,w=Math.max(6,(x.max-x.min)/rg*100);
    return`<div class="d"><div class="n">${nm}<small>${dt.toLocaleDateString('ru',{day:'numeric',month:'short'})}</small></div>
      <div class="i">${icon(di.kind,1)}</div><div class="pp">${x.pop>=20?x.pop+'%':''}</div>
      <div class="mn">${T(x.min)}</div>
      <div class="bar"><i style="left:${l}%;width:${w}%;background:linear-gradient(90deg,${tcol(x.min)},${tcol(x.max)})"></i></div>
      <div class="mx">${T(x.max)}</div></div>`}).join('');
  const di=dIdx(cu.dir),rot=cu.dir+180;
  const compass=`<svg class="compass" viewBox="0 0 150 150"><circle cx="75" cy="75" r="68" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.14)"/>
    ${Array.from({length:36},(_,n)=>{const a=n*10*Math.PI/180,l=n%9===0?0:n%3===0?6:3;return`<line x1="${75+Math.sin(a)*(68-l-3)}" y1="${75-Math.cos(a)*(68-l-3)}" x2="${75+Math.sin(a)*66}" y2="${75-Math.cos(a)*66}" stroke="rgba(255,255,255,${n%9===0?.0:.3})" stroke-width="1"/>`}).join('')}
    <g fill="rgba(255,255,255,.6)" font-size="11" text-anchor="middle" font-weight="600"><text x="75" y="20">С</text><text x="132" y="79">В</text><text x="75" y="136">Ю</text><text x="18" y="79">З</text></g>
    <g class="arrow" id="warrow" style="transform:rotate(0deg)" data-rot="${rot}"><path d="M75 36 L86 82 L75 74 L64 82 Z" fill="#8ab4ff"/><circle cx="75" cy="75" r="4" fill="#0b0f1c" stroke="#8ab4ff" stroke-width="2"/></g></svg>`;
  const tile=(ic,kk,v,u,s,m)=>`<div class="rv tile" style="--i:${k++}"><div class="k">${IC[ic]}${kk}</div><div class="v">${v}<small>${u}</small></div>${s?`<div class="s">${s}</div>`:''}${m!=null?`<div class="meter"><i data-w="${m}"></i></div>`:''}</div>`;
  return`<div class="sheet-inner"><div class="grab"></div>
  <button class="close" id="sclose" aria-label="Закрыть">${IC.x.replace('<svg','<svg')}</button>
  <div class="hero rv" style="--i:0"><div><div class="sub">${c.sub||''}</div><h2>${c.name}</h2><div class="big">${T(cu.temp)}</div>
    <div class="desc">${i.text}</div><div class="hl">Ощущается как ${T(cu.feels)} · ↑ ${T(td.max)} ↓ ${T(td.min)}</div></div>
    <div class="hero-icon">${icon(i.kind,i.day)}</div></div>
  <section class="blk rv" style="--i:2"><h3>Ближайшие 24 часа</h3><div class="panel hours">${hours}</div></section>
  <section class="blk rv" style="--i:3"><h3>Прогноз на 7 дней</h3><div class="panel days">${days}</div></section>
  <section class="blk rv" style="--i:4"><h3>Ветер</h3><div class="panel wind">${compass}
    <div class="wtxt"><div class="sp">${cu.wind.toFixed(1).replace('.',',')}<small>м/с</small></div><div class="dn">${DIRN[di]}, ${DIR[di]}</div>
    <div class="ex">${windLabel(cu.wind)}<br>порывы до ${Math.round(cu.gust)} м/с</div></div></div></section>
  <section class="blk"><h3 class="rv" style="--i:5">Подробности</h3><div class="tiles">
    ${tile('thermo','Ощущается',Math.round(cu.feels),'°',cu.feels<cu.temp-1?'Холоднее из-за ветра':cu.feels>cu.temp+1?'Теплее из-за влажности':'Близко к реальной')}
    ${tile('drop','Влажность',cu.hum,'%',cu.hum<30?'Сухо':cu.hum<60?'Комфортно':cu.hum<80?'Влажно':'Очень влажно',cu.hum)}
    ${tile('gauge','Давление',Math.round(cu.press*.750062),'мм рт. ст.','')}
    ${tile('eye','Видимость',cu.vis!=null?(cu.vis/1000>=20?'20+':(cu.vis/1000).toFixed(1).replace('.',',')):'—','км','')}
    ${tile('sun','УФ-индекс',Math.round(td.uv),'',uvLabel(td.uv),clamp(td.uv/11*100,3,100))}
    ${tile('cloud','Облачность',cu.cloud,'%','',cu.cloud)}
    ${tile('rain','Осадки сегодня',td.pr.toFixed(1).replace('.',','),'мм',td.pop>=20?'Вероятность '+td.pop+'%':'Без осадков')}
    ${tile('rise','Восход',tm(td.sr),'','')}
    ${tile('set','Закат',tm(td.ss),'','')}
  </div></section>
  <div class="foot">Данные Open-Meteo · обновлено ${new Date(d.fetched).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'})}</div></div>`;
}
function openDetail(id,card){
  if(sheetOpen||animating||!data[id])return;
  const c=cities.find(x=>x.id===id),d=data[id];
  animating=true;sheetOpen=true;openId=id;openCard=card;vib(8);
  sscroll.innerHTML=detailHTML(c,d);sscroll.scrollTop=0;
  const r=card.getBoundingClientRect();
  sheet.classList.add('show');
  const f=sheet.getBoundingClientRect();
  const inner=sscroll.firstElementChild;inner.style.width=f.width+'px';
  card.classList.add('lifted');card.style.visibility='hidden';
  backdrop.classList.add('on');document.body.style.overflow='hidden';
  setMood(id);
  try{history.pushState({d:1},'');pushed=true}catch(e){pushed=false}
  const a=sheet.animate([kf(r,'26px'),kf(f,isMobile()?'0px':'32px')],{duration:620,easing:'cubic-bezier(.2,.85,.2,1)'});
  requestAnimationFrame(()=>{sheet.classList.add('open');
    const w=$('#warrow');if(w)w.style.transform=`rotate(${w.dataset.rot}deg)`;
    sheet.querySelectorAll('.meter i').forEach(m=>m.style.width=m.dataset.w+'%');});
  a.onfinish=()=>{inner.style.width='';animating=false};
  $('#sclose').onclick=()=>requestClose();
}
function requestClose(){
  if(!sheetOpen||animating)return;
  if(pushed){pushed=false;try{history.back();return}catch(e){}}
  doClose();
}
function doClose(){
  if(!sheetOpen||animating)return;
  animating=true;
  const f=sheet.getBoundingClientRect();
  sheet.style.transform='';sheet.style.transition='';
  const card=grid.querySelector(`.card[data-id="${CSS.escape(openId)}"]`);
  const inner=sscroll.firstElementChild;if(inner)inner.style.width=f.width+'px';
  sheet.classList.remove('open');
  backdrop.classList.remove('on');
  let frames;
  if(card){const r=card.getBoundingClientRect();
    const vis=r.bottom>0&&r.top<innerHeight;
    frames=vis?[kf(f,isMobile()?'0px':'32px'),kf(r,'26px')]:[{...kf(f,'32px'),opacity:1},{...kf(f,'32px'),opacity:0,transform:'scale(.94)'}];}
  else frames=[{...kf(f,'32px'),opacity:1},{...kf(f,'32px'),opacity:0,transform:'scale(.94)'}];
  sscroll.animate([{opacity:1},{opacity:0}],{duration:200,fill:'forwards'});
  const a=sheet.animate(frames,{duration:480,easing:'cubic-bezier(.5,0,.2,1)'});
  a.onfinish=()=>{
    sscroll.getAnimations().forEach(x=>x.cancel());
    sheet.classList.remove('show');sscroll.innerHTML='';
    grid.querySelectorAll('.card.lifted').forEach(x=>{x.style.visibility='';x.classList.remove('lifted')});
    document.body.style.overflow='';sheetOpen=false;animating=false;openId=null;
    setMood(cities[0].id);
  };
}
addEventListener('popstate',()=>{if(sheetOpen){pushed=false;doClose()}else if(modal.classList.contains('on'))closeModal()});
backdrop.addEventListener('click',()=>{if(modal.classList.contains('on'))closeModal();else requestClose()});
addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(modal.classList.contains('on'))closeModal();else requestClose()}
  if((e.key==='Enter'||e.key===' ')&&document.activeElement?.classList.contains('card')){e.preventDefault();document.activeElement.click()}
});

/* свайп вниз для закрытия (телефон) */
(function(){
  let y0=0,dy=0,drag=false,on=false;
  sheet.addEventListener('touchstart',e=>{if(!sheetOpen||animating)return;on=sscroll.scrollTop<=0&&!e.target.closest('.hours');y0=e.touches[0].clientY;dy=0;drag=false},{passive:true});
  sheet.addEventListener('touchmove',e=>{
    if(!on)return;dy=e.touches[0].clientY-y0;
    if(dy>6&&sscroll.scrollTop<=0){drag=true;if(e.cancelable)e.preventDefault();
      sheet.style.transition='none';sheet.style.transform=`translateY(${dy*.85}px) scale(${1-Math.min(dy,400)/3000})`;
      backdrop.style.opacity=String(clamp(1-dy/500,.2,1));}
  },{passive:false});
  sheet.addEventListener('touchend',()=>{
    if(!drag){return}
    drag=false;backdrop.style.opacity='';
    if(dy>120){vib(8);requestClose()}
    else{sheet.style.transition='transform .45s cubic-bezier(.2,.8,.2,1)';sheet.style.transform='';setTimeout(()=>sheet.style.transition='',460)}
  });
})();

/* ---------- клики по сетке ---------- */
grid.addEventListener('click',e=>{
  const rm=e.target.closest('.rm');
  if(rm){e.stopPropagation();removeCity(rm.closest('.card').dataset.id);return}
  const card=e.target.closest('.card');if(!card)return;
  if(card.classList.contains('add')){openModal();return}
  const id=card.dataset.id;
  if(state[id]==='err'||!data[id]){const c=cities.find(x=>x.id===id);state[id]='loading';updateCard(id);load(c);return}
  openDetail(id,card);
});
$('#refresh').addEventListener('click',()=>{vib(6);refreshAll()});

/* ---------- курсор, «ареал», касания ---------- */
const glow=$('#glow'),ring=$('#ring');
let tx=innerWidth/2,ty=innerHeight*.4,gx=tx,gy=ty,rx=tx,ry=ty,loopOn=false,mouse=false,hideT;
function loop(){
  gx+=(tx-gx)*.13;gy+=(ty-gy)*.13;rx+=(tx-rx)*.32;ry+=(ty-ry)*.32;
  glow.style.transform=`translate3d(${gx}px,${gy}px,0)`;
  ring.style.transform=`translate3d(${rx}px,${ry}px,0)`;
  const s=document.documentElement.style;s.setProperty('--gx',gx+'px');s.setProperty('--gy',gy+'px');
  requestAnimationFrame(loop);
}
function startLoop(){if(!loopOn){loopOn=true;requestAnimationFrame(loop)}}
const INTER='button,.card,a,input,.chip,.res,.tile';
addEventListener('pointermove',e=>{
  tx=e.clientX;ty=e.clientY;startLoop();
  if(e.pointerType==='mouse'){
    if(!mouse){mouse=true;gx=tx;gy=ty;rx=tx;ry=ty}
    glow.classList.add('on');ring.classList.add('on');
    ring.classList.toggle('big',!!e.target.closest?.(INTER));
    const card=e.target.closest?.('.card');
    if(card&&!sheetOpen){const r=card.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
      card.style.setProperty('--mx',x+'px');card.style.setProperty('--my',y+'px');
      if(!card.classList.contains('add')){card.style.setProperty('--ry',((x/r.width-.5)*7).toFixed(2)+'deg');card.style.setProperty('--rx',((.5-y/r.height)*7).toFixed(2)+'deg')}}
  }else{
    glow.classList.add('on');clearTimeout(hideT);
    const card=e.target.closest?.('.card');
    if(card){const r=card.getBoundingClientRect();card.style.setProperty('--mx',(e.clientX-r.left)+'px');card.style.setProperty('--my',(e.clientY-r.top)+'px')}
  }
});
addEventListener('pointerleave',()=>{glow.classList.remove('on');ring.classList.remove('on')});
document.addEventListener('mouseleave',()=>{glow.classList.remove('on');ring.classList.remove('on')});
grid.addEventListener('pointerout',e=>{const c=e.target.closest('.card');if(c&&!c.contains(e.relatedTarget)){c.style.setProperty('--rx','0deg');c.style.setProperty('--ry','0deg')}});
addEventListener('pointerdown',e=>{
  tx=e.clientX;ty=e.clientY;startLoop();
  if(e.pointerType!=='mouse'){gx=tx;gy=ty;glow.classList.add('on');clearTimeout(hideT)}
  const card=e.target.closest?.('.card');
  if(card&&!sheetOpen){
    const r=card.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
    card.style.setProperty('--mx',x+'px');card.style.setProperty('--my',y+'px');
    if(e.pointerType!=='mouse')card.classList.add('pressed');
    const s=Math.max(r.width,r.height)*2.2,rp=document.createElement('span');rp.className='ripple';
    rp.style.cssText=`width:${s}px;height:${s}px;left:${x-s/2}px;top:${y-s/2}px`;card.appendChild(rp);setTimeout(()=>rp.remove(),720);
  }
},{passive:true});
const up=e=>{
  grid.querySelectorAll('.pressed').forEach(c=>c.classList.remove('pressed'));
  if(e.pointerType&&e.pointerType!=='mouse'){clearTimeout(hideT);hideT=setTimeout(()=>glow.classList.remove('on'),700)}
};
addEventListener('pointerup',up);addEventListener('pointercancel',up);

/* ---------- старт ---------- */
(function hello(){
  const n=new Date(),h=n.getHours();
  const g=h<5?'Доброй ночи':h<12?'Доброе утро':h<18?'Добрый день':'Добрый вечер';
  const dt=n.toLocaleDateString('ru',{weekday:'long',day:'numeric',month:'long'});
  $('#hello').textContent=g+' · '+dt.replace(/^./,m=>m.toUpperCase());
})();
renderGrid(true);
setMood(cities[0].id);
if(!matchMedia('(pointer:fine)').matches){gx=tx;gy=ty;startLoop()}
refreshAll();
setInterval(refreshAll,15*60e3);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastRefresh>5*60e3)refreshAll()});
</script>
</body>
</html>
